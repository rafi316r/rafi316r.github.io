<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <!-- Importiamo i font moderni e le icone ufficiali per i tuoi social -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 430px; text-align: center; padding: 20px; }
        h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; }
        .bio { font-size: 0.95rem; color: #94a3b8; margin-bottom: 32px; }
        .links { display: flex; flex-direction: column; gap: 16px; }
        .link-btn { display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; position: relative; }
        .link-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.25); }
        .icon { position: absolute; left: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Intestazione -->
        <h1>@isl</h1>
        <p class="bio">Benvenuto nel mio spazio digitale. Trovi tutti i miei canali ufficiali qui sotto.</p>

        <!-- I tuoi 4 Link configurati -->
        <div class="links">
            <a href="https://instagram.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram icon"></i> Instagram
            </a>
            <a href="https://threads.net" target="_blank" class="link-btn">
                <i class="fa-brands fa-threads icon"></i> Threads
            </a>
            <a href="https://tiktok.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok icon"></i> TikTok
            </a>
            <a href="mailto:i@rafiqul.com" class="link-btn">
                <i class="fa-solid fa-envelope icon"></i> Scrivimi una Email
            </a>
        </div>
    </div>

</body>
</html>
