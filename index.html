<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    
    <!-- Font Inter da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Tema Scuro: Sfumatura profonda Nero e Blu Notte */
        body { 
            background: linear-gradient(135deg, #020205 0%, #050a14 100%); 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .container { 
            width: 100%; 
            max-width: 430px; 
            text-align: center; 
            padding: 20px; 
        }
        
        .links { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        /* Pulsanti stile minimal con bordo sottile */
        .link-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1rem; 
            transition: all 0.25s ease; 
            position: relative; 
        }
        
        /* Effetto al tocco/hover */
        .link-btn:active, .link-btn:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: rgba(255, 255, 255, 0.2); 
            transform: translateY(-1px);
        }
        
        .icon { 
            position: absolute; 
            left: 20px; 
            font-size: 1.2rem; 
        }
    </style>
</head>
<body>

    <main class="container">
        <nav class="links">
            <a href="mailto:i@rafiqul.com" class="link-btn">
                <i class="fa-solid fa-envelope icon"></i> Email
            </a>
            <a href="https://instagram.com/isl" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-instagram icon"></i> Instagram
            </a>
            <a href="https://threads.net/@isl" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-threads icon"></i> Threads
            </a>
            <a href="https://tiktok.com/@islam" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-tiktok icon"></i> TikTok
            </a>
        </nav>
    </main>

</body>
</html>
